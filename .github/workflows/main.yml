name: FRESCA CI

on:
  push:
    branches: [ main, dev/improve ]
  pull_request:
    branches: [ main ]

jobs:
  webapp-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r webapp/requirements.txt
    - name: Run tests
      run: |
        cd webapp
        python -m pytest test_app.py

  arduino-compilation:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Arduino CLI
      uses: arduino/setup-arduino-cli@v2
    - name: Install platform
      run: |
        arduino-cli core update-index
        arduino-cli core install arduino:avr
    - name: Install LiquidCrystal
      run: arduino-cli lib install "LiquidCrystal"
    - name: Compile fresca
      run: |
        arduino-cli compile --fqbn arduino:avr:mega:cpu=atmega2560 --libraries arduino/lib arduino/fresca
    - name: Compile test
      run: |
        arduino-cli compile --fqbn arduino:avr:mega:cpu=atmega2560 --libraries arduino/lib test
