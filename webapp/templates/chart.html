{% extends "layout.html" %}

{% block extra_head %}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  .controls-card {
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
  }
</style>
{% endblock %}

{% block content %}
<div class="card controls-card">
  <div class="form-row">
    <div class="input-group">
      <label for="sens_select">Sensor</label>
      <select name="sens_select" id="sens_select">
        {% for sens in range(8) %}
        <option value="{{ sens }}" {% if sensor==sens %} selected {% endif %}>Sensor {{ sens }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="input-group">
      <label for="day_select">Date</label>
      <div style="display: flex; gap: 0.5rem;">
        <select name="day_select" id="day_select">
          {% for d in range(1,32) %}
          <option value="{{ d }}" {% if day==d %} selected {% endif %}>{{ d }}</option>
          {% endfor %}
        </select>
        <select name="month_select" id="month_select">
          {% for m in range(1,13) %}
          <option value="{{ m }}" {% if month==m %} selected {% endif %}>{{ m }}</option>
          {% endfor %}
        </select>
        <select name="year_select" id="year_select">
          {% for y in range(2018,2035) %}
          <option value="{{ y }}" {% if year==y %} selected {% endif %}>{{ y }}</option>
          {% endfor %}
        </select>
      </div>
    </div>
  </div>

  <div class="form-row">
    <div class="input-group">
      <label>Start Time (HH:MM:SS)</label>
      <div style="display: flex; gap: 0.5rem;">
        <select id="hour_start_select">
          {% for h in range(24) %}<option value="{{ h }}" {% if start_hour==h %} selected {% endif %}>{{
            "%02d"|format(h) }}</option>{% endfor %}
        </select>
        <select id="minute_start_select">
          {% for m in range(60) %}<option value="{{ m }}" {% if start_minute==m %} selected {% endif %}>{{
            "%02d"|format(m) }}</option>{% endfor %}
        </select>
        <select id="second_start_select">
          {% for s in range(60) %}<option value="{{ s }}" {% if start_second==s %} selected {% endif %}>{{
            "%02d"|format(s) }}</option>{% endfor %}
        </select>
      </div>
    </div>
    <div class="input-group">
      <label>End Time (HH:MM:SS)</label>
      <div style="display: flex; gap: 0.5rem;">
        <select id="hour_end_select">
          {% for h in range(24) %}<option value="{{ h }}" {% if end_hour==h %} selected {% endif %}>{{ "%02d"|format(h)
            }}</option>{% endfor %}
        </select>
        <select id="minute_end_select">
          {% for m in range(60) %}<option value="{{ m }}" {% if end_minute==m %} selected {% endif %}>{{
            "%02d"|format(m) }}</option>{% endfor %}
        </select>
        <select id="second_end_select">
          {% for s in range(60) %}<option value="{{ s }}" {% if end_second==s %} selected {% endif %}>{{
            "%02d"|format(s) }}</option>{% endfor %}
        </select>
      </div>
    </div>
  </div>

  <div class="form-row" style="align-items: end;">
    <div class="input-group">
      <label for="decimate_select">Decimation</label>
      <select id="decimate_select">
        {% for d in range(1,61) %}<option value="{{ d }}" {% if decimate_by==d %} selected {% endif %}>{{ d }} samples
        </option>{% endfor %}
      </select>
    </div>
    <div class="input-group" style="flex-direction: row; align-items: center; gap: 0.5rem; height: 100%;">
      <input type="checkbox" id="movavg_check" {% if movavg_check %} checked {% endif %}>
      <label for="movavg_check" style="margin: 0;">Use Moving Average</label>
    </div>
    <div class="input-group">
      <input type="button" id="update-btn" value="Update Chart" onclick="updateChart()">
    </div>
  </div>
</div>

<div class="card" style="position: relative;">
  <div id="loading-overlay" class="loading-overlay">
    <div class="loading-spinner"></div>
  </div>
  <div id="chart-header">
    <h3 id="chart-title">Sensor Data</h3>
  </div>
  <div class="chart-container">
    <canvas id="tempChart"></canvas>
  </div>
  <div class="footer-info">
    <span id="data-points-info">Datapoints: <b>0</b></span>
    <span id="exec-time-info">Load Time: <b>0s</b></span>
  </div>
</div>

<script>
  let myChart = null;

  function updateChart() {
    const overlay = $('#loading-overlay');
    overlay.css('display', 'flex');

    const startTime = performance.now();
    const data = {
      sens_select: $('#sens_select').val(),
      day_select: $('#day_select').val(),
      month_select: $('#month_select').val(),
      year_select: $('#year_select').val(),
      hour_start_select: $('#hour_start_select').val(),
      minute_start_select: $('#minute_start_select').val(),
      second_start_select: $('#second_start_select').val(),
      hour_end_select: $('#hour_end_select').val(),
      minute_end_select: $('#minute_end_select').val(),
      second_end_select: $('#second_end_select').val(),
      decimate_select: $('#decimate_select').val(),
      movavg_check: $('#movavg_check').is(':checked') ? 1 : 0
    };

    $.ajax({
      type: "POST",
      url: "{{ url_for('chart_update') }}",
      dataType: "json",
      data: data,
      success: function (response) {
        renderChart(response);
        const endTime = performance.now();
        $('#exec-time-info b').text(((endTime - startTime) / 1000).toFixed(3) + 's');
        $('#data-points-info b').text(response.length - 1);
        overlay.hide();
      },
      error: function (xhr) {
        alert("Error fetching data: " + (xhr.responseJSON ? xhr.responseJSON.error : "Unknown error"));
        overlay.hide();
      }
    });
  }

  function renderChart(jsonData) {
    const labels = [];
    const values = [];

    // Skip header
    for (let i = 1; i < jsonData.length; i++) {
      labels.push(jsonData[i][0]);
      values.push(jsonData[i][1]);
    }

    const ctx = document.getElementById('tempChart').getContext('2d');

    if (myChart) {
      myChart.destroy();
    }

    myChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [{
          label: 'Temperature (°C)',
          data: values,
          borderColor: '#2ECC71',
          backgroundColor: 'rgba(46, 204, 113, 0.1)',
          borderWidth: 2,
          pointRadius: labels.length > 100 ? 0 : 3,
          tension: 0.3,
          fill: true
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: {
          intersect: false,
          mode: 'index',
        },
        scales: {
          x: {
            grid: { color: '#333' },
            ticks: { color: '#B0B0B0', maxRotation: 45, autoSkip: true }
          },
          y: {
            grid: { color: '#333' },
            ticks: { color: '#B0B0B0' },
            suggestedMin: 0,
            suggestedMax: 35
          }
        },
        plugins: {
          legend: { display: false }
        }
      }
    });

    // Update title
    $('#chart-title').text(`Sensor ${$('#sens_select').val()} - ${$('#day_select').val()}/${$('#month_select').val()}/${$('#year_select').val()}`);
  }

  $(document).ready(function () {
    updateChart();
  });
</script>
{% endblock %}
